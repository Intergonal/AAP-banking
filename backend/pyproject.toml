[project]
name = "aap-api"
version = "0.1.0"
description = "AAP banking backend API"
readme = "README.md"
authors = [
    { name = "Intergonal", email = "pear32768a1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "google-genai>=2.18.1",
    "huggingface-hub>=1.28.0",
    "jax>=0.11.1",
    "keras>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "yfinance>=1.6.0",
]

[project.scripts]
start = "aap_api.server:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
